<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio</title>
  <meta name="description" content="Personal portfolio: about me, skills, projects, achievements and contact information.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Portfolio">
  <meta property="og:description" content="About me, skills, projects, achievements and contact information.">
  <meta name="theme-color" content="#1d68f0">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:ital,wght@0,400;0,700;1,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="progress" id="progress" aria-hidden="true"></div>

  <header class="nav" id="nav">
    <a class="nav__brand" href="#home" id="brand" aria-label="Home"></a>
    <button class="nav__toggle" id="navToggle" aria-expanded="false" aria-controls="navLinks" aria-label="Open menu">
      <span></span><span></span>
    </button>
    <nav class="nav__links" id="navLinks" aria-label="Main">
      <a href="#home">Home</a>
      <a href="#about">About</a>
      <a href="#skills">Skills</a>
      <a href="#projects">Projects</a>
      <a href="#achievements">Achievements</a>
      <a href="#contact" class="nav__cta">Contact</a>
    </nav>
  </header>

  <main id="main">
    <!-- 1. HOME -->
    <section class="hero" id="home">
      <div class="hero__glow" aria-hidden="true">
        <span class="blob blob--a"></span>
        <span class="blob blob--b"></span>
        <span class="hero__spot"></span>
        <span class="hero__grid"></span>
      </div>
      <div class="wrap hero__inner">
        <p class="eyebrow" id="heroEyebrow"></p>
        <h1 class="hero__name" id="heroName"></h1>
        <p class="hero__role" id="heroRole"></p>
        <p class="hero__tagline" id="heroTagline"></p>
        <div class="hero__actions">
          <a class="btn btn--primary" href="#projects">View my work</a>
          <a class="btn btn--ghost" href="#contact">Contact me</a>
        </div>
      </div>
      <a class="hero__scroll" href="#about" aria-label="Scroll to About"><span></span></a>
    </section>

    <!-- 2. ABOUT -->
    <section class="section" id="about">
      <div class="wrap">
        <header class="section__head reveal">
          <span class="section__num">01</span>
          <h2>About me</h2>
        </header>
        <div class="about">
          <div class="about__photo reveal" id="aboutPhoto"></div>
          <div class="about__text reveal" id="aboutText"></div>
          <div class="about__edu reveal">
            <h3 class="label">Education</h3>
            <ol class="timeline" id="education"></ol>
          </div>
        </div>
      </div>
    </section>

    <!-- 3. SKILLS -->
    <section class="section" id="skills">
      <div class="wrap">
        <header class="section__head reveal">
          <span class="section__num">02</span>
          <h2>Skills</h2>
        </header>
        <div class="skills" id="skillGroups"></div>
      </div>
    </section>

    <!-- 4. PROJECTS -->
    <section class="section" id="projects">
      <div class="wrap">
        <header class="section__head reveal">
          <span class="section__num">03</span>
          <h2>Projects</h2>
        </header>
        <div class="projects" id="projectList"></div>
      </div>
    </section>

    <!-- 5. ACHIEVEMENTS -->
    <section class="section" id="achievements">
      <div class="wrap">
        <header class="section__head reveal">
          <span class="section__num">04</span>
          <h2>Achievements</h2>
        </header>
        <ul class="achievements" id="achievementList"></ul>
      </div>
    </section>

    <!-- 6. CONTACT -->
    <section class="section contact" id="contact">
      <div class="wrap contact__inner reveal">
        <span class="section__num">05</span>
        <h2 class="contact__title">Get in <span class="grad">touch</span></h2>
        <p class="contact__blurb" id="contactBlurb"></p>
        <div class="contact__actions" id="contactActions"></div>
        <ul class="contact__links" id="contactLinks"></ul>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="wrap footer__inner">
      <span id="footerText"></span>
      <a href="#home">Back to top ↑</a>
    </div>
  </footer>

  <a class="to-top" id="toTop" href="#home" aria-label="Back to top">↑</a>

  <noscript><p class="noscript">This site needs JavaScript enabled to display its content.</p></noscript>
  <script src="js/content.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
